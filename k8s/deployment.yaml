apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-api
  template:
    metadata:
      labels:
        app: server-api
    spec:
      containers:
        - name: server-api
          image: server-management-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "server_management"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "example"
            - name: DB_PORT
              value: "5432"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FILE
              value: "/logs/app.log"
          volumeMounts:
            - name: log-volume
              mountPath: /logs
      volumes:
        - name: log-volume
          emptyDir: {}
