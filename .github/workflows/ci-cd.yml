name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: server_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d server_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_NAME: server_management
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      RUN_INTEGRATION_TESTS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint & type check
      run: |
        pip install ruff
        ruff check app tests

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Prepare test database schema
      run: |
        PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f sql/schema.sql

    - name: Run tests
      run: |
        pytest -q

  build-push-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/server-management-api:latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -f docker/Dockerfile -t $IMAGE .
        docker push $IMAGE

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure Kubeconfig
      run: |
        mkdir -p ${{ github.workspace }}/.kube
        echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > ${{ github.workspace }}/.kube/config
        echo "KUBECONFIG=${{ github.workspace }}/.kube/config" >> $GITHUB_ENV

    - name: Create or update Kubernetes DB secret
      run: |
        kubectl create secret generic server-management-db \
          --from-literal=DB_NAME='${{ secrets.DB_NAME }}' \
          --from-literal=DB_USER='${{ secrets.DB_USER }}' \
          --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
          --from-literal=POSTGRES_DB='${{ secrets.DB_NAME }}' \
          --from-literal=POSTGRES_USER='${{ secrets.DB_USER }}' \
          --from-literal=POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD }}' \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to cluster
      run: |
        kubectl set image deployment/server-api server-api=$IMAGE || true
        kubectl rollout status deployment/server-api
