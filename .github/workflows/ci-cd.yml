name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint & type check
      run: |
        pip install ruff
        ruff check app

    - name: Run tests
      run: |
        # example placeholder, add real tests if you have them
        echo "No tests configured yet"

  build-push-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository }}/server-management-api:latest
        docker build -f docker/Dockerfile -t $IMAGE .
        docker push $IMAGE

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure Kubeconfig
      run: |
        mkdir -p ${{ github.workspace }}/.kube
        echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > ${{ github.workspace }}/.kube/config
        export KUBECONFIG=${{ github.workspace }}/.kube/config

    - name: Deploy to cluster
      run: |
        kubectl set image deployment/server-api server-api=$IMAGE --record || true
        kubectl rollout status deployment/server-api
