version: '3.9'

services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: server_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ..      # project root (one level above this compose file)
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: server_management
      DB_USER: postgres
      DB_PASSWORD: example
      DB_PORT: 5432
      LOG_LEVEL: INFO
      LOG_FILE: /logs/app.log
    volumes:
      - ./logs:/logs

volumes:
  db_data:
